<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XRF Sample Processor</title>
<style>
  body { font-family: Arial, sans-serif; margin: 20px; }
  #top-container { display: flex; gap: 20px; }
  #controls { flex: 1; max-width: 600px; }
  #dateSelectors { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; }
  #elementCheckboxes { max-height: 130px; overflow-y: auto; border: 1px solid #ccc; padding: 5px; margin-top: 10px; }
  table { border-collapse: collapse; width: 100%; margin-top: 20px; }
  th, td { border: 1px solid #ccc; padding: 5px; text-align: left; font-size: 12px; }
  th { background-color: #f2f2f2; }
  td { white-space: nowrap; }
  input, select, button { margin: 5px 0; padding: 5px; }
  #avgChartContainer { flex: 1; height: 80vh; }
  #avgChart { width: 100%; height: 100%; }
</style>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<h2>XRF Sample Processor</h2>

<div id="top-container">
  <div id="controls">
    <label for="csvFile">Select CSV file:</label>
    <input type="file" id="csvFile"><br>

    <div id="dateSelectors">
      <div>
        <label for="startDateSelect">Start date:</label>
        <select id="startDateSelect"><option value="">-- Load CSV --</option></select>
      </div>
      <div>
        <label for="endDateSelect">End date:</label>
        <select id="endDateSelect"><option value="">-- Load CSV --</option></select>
      </div>
      <button onclick="showRowsForRange()">Show Rows for Date Range</button>
    </div>

    <h3>Elements</h3>
    <div id="elementCheckboxes"></div>
    <button onclick="clearCheckboxes()">Clear Checkboxes</button>
    <button onclick="showAndChartSelectedElements()">Show & Chart Selected Elements</button>
    <button onclick="downloadDisplayedRows()">Download Displayed Rows</button>
    <br>
    <input type="checkbox" id="logScale"> <label for="logScale">Log scale</label>
    <input type="checkbox" id="showErrorBars"> <label for="showErrorBars">Show error bars</label>
    <br>
    <input type="checkbox" id="downloadProcessed"> <label for="downloadProcessed">Download processed CSV</label>
  </div>

  <div id="avgChartContainer">
    <canvas id="avgChart"></canvas>
  </div>
</div>

<div id="output"></div>

<script>
let allSamples = [];
let displayedRows = [];
let originalHeaders = [];
let chartInstance = null;
const fixedColumns = ["File #","DateTime","Operator","Name","ID","Field1","Field2","Application","Method","ElapsedTime"];

function cleanString(str) {
  return str ? str.replace(/[\u0000-\u001F\u007F-\u009F]/g, '').trim() : '';
}

document.getElementById('csvFile').addEventListener('change', function() {
  const file = this.files[0];
  const reader = new FileReader();

  reader.onload = function(e) {
    const text = e.target.result;
    const lines = text.split(/\r?\n/).filter(l => l.trim() !== '');
    allSamples = [];

    const headerLine = lines.find(line => line.includes('DateTime'));
    if (!headerLine) { console.error("DateTime column not found!"); return; }

    originalHeaders = headerLine.split(/\t|,/).map(h => cleanString(h));

    const headerIndexMap = {};
    originalHeaders.forEach((h,i) => { headerIndexMap[h] = i; });

    const uniqueDates = new Set();

    lines.forEach(line => {
      const cells = line.split(/\t|,/).map(c => cleanString(c));
      if (cells.length === 0) return;

      const rowObj = {};
      originalHeaders.forEach(h => {
        const idx = headerIndexMap[h];
        rowObj[h] = (idx !== undefined && cells[idx] !== undefined) ? cells[idx] : '';
      });

      allSamples.push(rowObj);

      if (rowObj['DateTime']) {
        const datePart = rowObj['DateTime'].split(' ')[0];
        if (datePart) uniqueDates.add(datePart);
      }
    });

    // Populate date selects
    const startSelect = document.getElementById('startDateSelect');
    const endSelect = document.getElementById('endDateSelect');
    startSelect.innerHTML = '<option value="">-- Select start date --</option>';
    endSelect.innerHTML = '<option value="">-- Select end date --</option>';

    Array.from(uniqueDates).sort((a,b) => new Date(a) - new Date(b)).forEach(d => {
      const opt1 = document.createElement('option'); opt1.value = d; opt1.textContent = d; startSelect.appendChild(opt1);
      const opt2 = document.createElement('option'); opt2.value = d; opt2.textContent = d; endSelect.appendChild(opt2);
    });

    populateElementCheckboxes();

    document.querySelectorAll('#elementCheckboxes input[type=checkbox]').forEach(cb => cb.checked = true);

    displayedRows = allSamples.slice();
    autoUpdateChart();
  };

  reader.readAsText(file, 'UTF-8');
});

function populateElementCheckboxes() {
  const container = document.getElementById('elementCheckboxes');
  container.innerHTML = '';
  const elementCols = originalHeaders
    .filter(h => !fixedColumns.includes(h) && !h.includes('Err') && !h.startsWith('Alloy') && !h.startsWith('Match Qual') && h !== 'Cal Check')
    .filter(h => originalHeaders.includes(h + ' Err'))
    .sort();

  elementCols.forEach(el => {
    const cb = document.createElement('input');
    cb.type = 'checkbox'; cb.value = el; cb.id = `cb_${el}`;
    cb.addEventListener('change', autoUpdateChart);
    const label = document.createElement('label'); label.htmlFor = `cb_${el}`; label.textContent = el;
    const br = document.createElement('br');
    container.appendChild(cb); container.appendChild(label); container.appendChild(br);
  });
}

function clearCheckboxes() {
  document.querySelectorAll('#elementCheckboxes input[type=checkbox]').forEach(cb => cb.checked = false);
  autoUpdateChart();
}

function showRowsForRange() {
  const startDateStr = document.getElementById('startDateSelect').value;
  const endDateStr = document.getElementById('endDateSelect').value;
  const startDate = startDateStr ? new Date(startDateStr) : null;
  const endDate = endDateStr ? new Date(endDateStr) : null;

  displayedRows = allSamples.filter(row => {
    if (!row['DateTime']) return false;
    const rowDate = new Date(row['DateTime'].split(' ')[0]);
    return (!startDate || rowDate >= startDate) && (!endDate || rowDate <= endDate);
  });

  autoUpdateChart();
}

function renderTable(rows, headersToShow) {
  const outputDiv = document.getElementById('output');
  outputDiv.innerHTML = '';

  const table = document.createElement('table');
  const thead = document.createElement('thead');
  const tbody = document.createElement('tbody');

  const headerRow = document.createElement('tr');
  headersToShow.forEach(h => {
    const th = document.createElement('th');
    th.textContent = h;
    headerRow.appendChild(th);
  });
  thead.appendChild(headerRow);

  rows.forEach(row => {
    const tr = document.createElement('tr');
    headersToShow.forEach(h => {
      let val = row[h] || '';
      if (!fixedColumns.includes(h) && val && val !== '<LOD' && val !== '< LOD') {
        val = parseFloat(val)*10000;
        if (isNaN(val)) val = '';
        else val = val.toFixed(2);
      }
      tr.appendChild(Object.assign(document.createElement('td'), { textContent: val || '' }));
    });
    tbody.appendChild(tr);
  });

  table.appendChild(thead);
  table.appendChild(tbody);
  outputDiv.appendChild(table);
}

function showAndChartSelectedElements() {
  const selectedElements = Array.from(document.querySelectorAll('#elementCheckboxes input[type=checkbox]'))
    .filter(cb => cb.checked).map(cb => cb.value);

  const allColumns = [...fixedColumns];
  selectedElements.forEach(el => {
    if (originalHeaders.includes(el) && originalHeaders.includes(el+' Err')) {
      allColumns.push(el, el+' Err');
    }
  });

  renderTable(displayedRows, allColumns);
}

function autoUpdateChart() { if(displayedRows.length>0) showAndChartSelectedElements(); }

function downloadDisplayedRows() {
  if(displayedRows.length === 0) return;
  const headers = originalHeaders.slice();
  let csvContent = headers.join(',') + '\n';
  displayedRows.forEach(row => {
    const rowData = headers.map(h => row[h] || '').join(',');
    csvContent += rowData + '\n';
  });
  const blob = new Blob([csvContent], {type:'text/csv;charset=utf-8;'});
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.setAttribute("download", "XRF_DisplayedRows.csv");
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
}

</script>

</body>
</html>
