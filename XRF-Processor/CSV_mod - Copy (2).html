<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XRF Sample Processor</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh; padding: 20px; }
  .container { max-width: 1200px; margin: 0 auto; background: white;
    border-radius: 20px; box-shadow: 0 20px 40px rgba(0,0,0,0.1); overflow: hidden; }
  .header { background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
    color: white; padding: 30px; text-align: center; }
  .header h1 { font-size: 2.5rem; font-weight: 700; margin-bottom: 10px; }
  .tabs { display: flex; background: #f8fafc; border-bottom: 1px solid #e2e8f0; }
  .tab { flex: 1; border: none; padding: 20px 30px; font-size: 1rem; font-weight: 600;
    color: #64748b; cursor: pointer; background: none; transition: all 0.3s ease; }
  .tab:hover { background: #e2e8f0; color: #4f46e5; }
  .tab.active { color: #4f46e5; background: white; }
  .tab-content { display: none; padding: 40px; }
  .tab-content.active { display: block; }
  .control-section { background: #f8fafc; border-radius: 15px; padding: 30px;
    margin-bottom: 30px; border: 1px solid #e2e8f0; }
  .control-row { display: flex; align-items: center; gap: 20px; margin-bottom: 20px; flex-wrap: wrap; }
  .file-input-button { background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
    color: white; padding: 12px 24px; border: none; border-radius: 10px; font-weight: 600;
    cursor: pointer; transition: all 0.3s ease; }
  .file-name { font-style: italic; color: #64748b; margin-left: 15px;
    padding: 8px 16px; background: white; border-radius: 8px; border: 1px solid #e2e8f0; }
  .date-selector-group { display: flex; gap: 15px; align-items: center; flex-wrap: wrap; }
  .date-selector label { font-weight: 500; font-size: 0.9rem; }
  .date-selector select { padding: 8px 12px; border: 1px solid #e2e8f0; border-radius: 8px; }
  .checkbox-wrapper { display: flex; align-items: center; gap: 10px; background: white;
    padding: 12px 20px; border-radius: 10px; border: 1px solid #e2e8f0; }
  .radio-group { display: flex; align-items: center; gap: 15px; background: white;
    padding: 12px 20px; border-radius: 10px; border: 1px solid #e2e8f0; }
  .radio-option { display: flex; align-items: center; gap: 8px; }
  .filter-button { background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
    color: white; padding: 12px 24px; border: none; border-radius: 10px; font-weight: 600; }
  .download-button { background: linear-gradient(135deg, #059669 0%, #047857 100%);
    color: white; padding: 12px 24px; border: none; border-radius: 10px; font-weight: 600; }
  .table-container { background: white; border-radius: 15px; border: 1px solid #e2e8f0;
    overflow: auto; box-shadow: 0 4px 15px rgba(0,0,0,0.05); max-height: 70vh; }
  table { width: 100%; border-collapse: collapse; }
  th { background: #f1f5f9; padding: 10px; font-weight: 600; border-bottom: 2px solid #e2e8f0; }
  td { padding: 8px; border-bottom: 1px solid #f1f5f9; font-size: 12px; white-space: nowrap; }
#elementsList {
  grid-template-columns: repeat(auto-fit, minmax(55px, 1fr)) !important;
  gap: 0 !important;
}
.element-card {
  background: #f1f5f9;
  padding: 10px;
  border: 1px solid #e2e8f0;
  border-radius: 0;
  text-align: center;
  font-weight: 600;
  color: #374151;
  cursor: pointer;
  transition: background 0.3s ease, color 0.3s ease;
  margin: -1px 0 0 -1px;   /* 🔑 overlap borders so no doubles */
}

.element-card:hover {
  background: #e2e8f0;
}

.element-card.selected {
  background: #4f46e5;
  color: white;
}

.date-info {
  background: #e0e7ff;
  border: 1px solid #c7d2fe;
  border-radius: 10px;
  padding: 15px;
  margin: 15px 0;
  color: #3730a3;
  font-weight: 500;
}

  #csvFile { display: none; }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>XRF Sample Processor</h1>
    <p>Advanced X-ray Fluorescence Data Analysis Tool</p>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="process-raw-data">Process Raw Data</button>
    <button class="tab" data-tab="analysis-tools">Analysis Tools</button>
    <button class="tab" data-tab="quality-control">Quality Control</button>
  </div>

  <div id="process-raw-data" class="tab-content active">
    <div class="control-section">
      <div class="control-row">
        <button class="file-input-button" onclick="document.getElementById('csvFile').click()">📁 Choose CSV File</button>
        <input type="file" id="csvFile" accept=".csv">
        <span id="fileName" class="file-name" style="display: none;"></span>
      </div>

      <div class="control-row date-selector-group">
        <div class="date-selector">
          <label for="startDateSelect">Start Date:</label>
          <select id="startDateSelect"><option value="">-- Load CSV first --</option></select>
        </div>
        <div class="date-selector">
          <label for="endDateSelect">End Date:</label>
          <select id="endDateSelect"><option value="">-- Load CSV first --</option></select>
        </div>
      </div>

      <div class="control-row">
        <div class="checkbox-wrapper">
          <input type="checkbox" id="scaleValues" checked>
          <label for="scaleValues">Convert to ppm (×10000)</label>
        </div>
        <button class="download-button" id="downloadBtn" onclick="downloadDisplayedRows()" disabled>💾 Download</button>
      </div>
    </div>

    <div id="output"><p style="padding:20px; color:#64748b;">📊 No data loaded.</p></div>
  </div>

  <div id="analysis-tools" class="tab-content">
    <div class="control-section">
      <h3 style="margin-bottom: 20px; color: #4f46e5;">Available Elements for Analysis</h3>
      <div id="elementsList" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 15px;">
        <!-- Elements will be populated here -->
      </div>
      <div style="margin-top: 20px; text-align: center;">
        <div class="radio-group" style="display: inline-flex; margin-right: 20px;">
          <div class="radio-option">
            <input type="radio" id="chartModeIndividual" name="chartMode" value="individual">
            <label for="chartModeIndividual">Individual Samples</label>
          </div>
          <div class="radio-option">
            <input type="radio" id="chartModeAverages" name="chartMode" value="averages" checked>
            <label for="chartModeAverages">Averages</label>
          </div>
        </div>
        <button class="filter-button" id="generateChart" onclick="generateChart()" disabled>📊 Generate Chart</button>
        <span id="selectedCount" style="margin-left: 15px; color: #64748b; font-weight: 500;">0 elements selected</span>
      </div>
    </div>
    
    <div id="chartSection" style="display: none;">
      <div class="control-section">
        <h3 style="margin-bottom: 20px; color: #4f46e5;">Element Analysis Chart</h3>
        <div id="dateRangeInfo" class="date-info" style="display: none;">
          <!-- Date range information will be displayed here -->
        </div>
        <div style="position: relative; height: 400px; width: 100%;">
          <canvas id="averageChart"></canvas>
        </div>
      </div>
    </div>
  </div>
  
  <div id="quality-control" class="tab-content">
    <p style="padding:20px; color:#64748b;">✅ Quality Control features coming soon…</p>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
<script>
let allSamples = [];
let displayedRows = [];
let originalHeaders = [];
let elementCols = [];
let chart = null;

// --- Tab switching ---
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', function() {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    this.classList.add('active');
    document.getElementById(this.dataset.tab).classList.add('active');
    
    // Populate elements list when Analysis Tools tab is clicked
    if (this.dataset.tab === 'analysis-tools') {
      populateElementsList();
    }
  });
});

// --- Chart mode radio listeners ---
document.querySelectorAll('input[name="chartMode"]').forEach(radio => {
  radio.addEventListener('change', function() {
    // Clear existing chart when mode changes
    if (chart) {
      chart.destroy();
      chart = null;
    }
    document.getElementById('chartSection').style.display = 'none';
    updateGenerateButton();
  });
});

// --- Populate Analysis Tools elements list ---
let selectedElements = new Set();

function populateElementsList() {
  const targetElements = ['As', 'Au', 'Ba', 'Bi', 'Ca', 'Cd', 'Ce', 'Co', 'Cr', 'Cu', 
                         'Fe', 'Ga', 'Hf', 'Hg', 'La', 'Mn', 'Mo', 'Nb', 'Pb', 'Pd', 
                         'Pt', 'Rb', 'Sb', 'Se', 'Sn', 'Sr', 'Ta', 'Te', 'Th', 'Ti', 
                         'Tl', 'U', 'V', 'W', 'Y', 'Zn', 'Zr'];
  
  const elementsList = document.getElementById('elementsList');
  if (!elementsList) return; // Exit if elements list doesn't exist
  
  elementsList.innerHTML = '';
  selectedElements.clear();
  
  targetElements.forEach(element => {
    const elementCard = document.createElement('div');
    elementCard.className = 'element-card';
    elementCard.textContent = element;
    elementCard.dataset.element = element;
    elementCard.onclick = () => toggleElementSelection(element, elementCard);
    elementsList.appendChild(elementCard);
  });
  
  updateSelectedCount();
}

// Handle mode changes
document.querySelectorAll('input[name="chartMode"]').forEach(radio => {
  radio.addEventListener("change", () => {
    // Clear selected elements
    selectedElements.clear();

    // Remove all highlights
    document.querySelectorAll(".element-card.selected").forEach(card => {
      card.classList.remove("selected");
    });

    updateSelectedCount();
    updateGenerateButton();
    console.log("Chart mode changed, cleared selections.");
  });
});

function toggleElementSelection(element, cardElement) {
  const chartMode = document.querySelector('input[name="chartMode"]:checked').value;

  if (chartMode === "individual") {
    // Clear all previous selections
    selectedElements.clear();
    document.querySelectorAll(".element-card.selected").forEach(card => {
      card.classList.remove("selected");
    });

    // Add only the clicked element
    selectedElements.add(element);
    cardElement.classList.add("selected");
  } else {
    // Normal toggle behavior for averages mode
    if (selectedElements.has(element)) {
      selectedElements.delete(element);
      cardElement.classList.remove("selected");
    } else {
      selectedElements.add(element);
      cardElement.classList.add("selected");
    }
  }

  updateSelectedCount();
  updateGenerateButton();
  console.log("Selected elements:", Array.from(selectedElements));
}



function updateSelectedCount() {
  const selectedCountElement = document.getElementById('selectedCount');
  if (!selectedCountElement) return; // Exit if element doesn't exist
  
  const count = selectedElements.size;
  selectedCountElement.textContent = `${count} element${count !== 1 ? 's' : ''} selected`;
}

function updateGenerateButton() {
  const generateBtn = document.getElementById('generateChart');
  if (generateBtn) {
    generateBtn.disabled = selectedElements.size === 0 || displayedRows.length === 0;
  }
}

function getDateRangeText() {
  const startDate = document.getElementById('startDateSelect');
  const endDate = document.getElementById('endDateSelect');
  
  const startValue = startDate.value;
  const endValue = endDate.value;
  const startText = startValue ? startDate.options[startDate.selectedIndex].text : null;
  const endText = endValue ? endDate.options[endDate.selectedIndex].text : null;
  
  if (!startText && !endText) {
    return "All available dates";
  } else if (startText && endText) {
    if (startText === endText) {
      return `Date: ${startText}`;
    } else {
      return `Date Range: ${startText} to ${endText}`;
    }
  } else if (startText) {
    return `From: ${startText}`;
  } else if (endText) {
    return `Until: ${endText}`;
  }
  
  return "All available dates";
}

// --- Helper functions ---
function pad2(n){ return String(n).padStart(2,'0'); }

function normalizeDatePart(dateStr) {
  if (!dateStr) return null;
  let s = dateStr.trim();
  
  console.log("Processing date string:", s);
  
  // Handle multiple formats where date and time are concatenated without space
  let dateOnly = s;
  
  // Pattern 1: MM/DD/YYYY followed by time (e.g., "10/4/201912:39:22PM")
  const slashTimeMatch = s.match(/^(\d{1,2}\/\d{1,2}\/\d{4})\d{1,2}:\d{1,2}:\d{1,2}(AM|PM)?/i);
  if (slashTimeMatch) {
    dateOnly = slashTimeMatch[1];
    console.log("Extracted slash format date:", dateOnly);
  } 
  // Pattern 2: MM-DD-YYYY followed by time (e.g., "10-21-201918:26")
  else {
    const dashTimeMatch = s.match(/^(\d{1,2}-\d{1,2}-\d{4})\d{1,2}:\d{1,2}/);
    if (dashTimeMatch) {
      dateOnly = dashTimeMatch[1];
      console.log("Extracted dash format date:", dateOnly);
    }
    // Pattern 3: Normal case with space separator
    else if (s.includes(' ')) {
      dateOnly = s.split(/\s+/)[0];
      console.log("Extracted space-separated date:", dateOnly);
    }
  }
  
  console.log("Final date string to parse:", dateOnly);
  
  const parts = dateOnly.split(/[-\/]/).map(p => p.trim());
  if (parts.length !== 3) {
    console.log("Invalid date parts:", parts);
    const d = new Date(dateOnly);
    if (isNaN(d)) return null;
    const mm = pad2(d.getMonth()+1), dd = pad2(d.getDate()), yyyy = d.getFullYear();
    return { display: `${mm}-${dd}-${yyyy}`, iso: `${yyyy}-${mm}-${dd}`, dateObj: new Date(yyyy, mm-1, dd) };
  }
  
  let mm, dd, yyyy;
  if (parts[0].length === 4) { 
    // Format: YYYY/MM/DD or YYYY-MM-DD
    yyyy = parts[0]; mm = parts[1]; dd = parts[2]; 
  } else if (parts[2].length === 4) { 
    // Format: MM/DD/YYYY or MM-DD-YYYY
    mm = parts[0]; dd = parts[1]; yyyy = parts[2]; 
  } else {
    // Try parsing as a date
    console.log("Falling back to Date parsing for:", dateOnly);
    const d = new Date(dateOnly);
    if (isNaN(d)) return null;
    mm = pad2(d.getMonth()+1); dd = pad2(d.getDate()); yyyy = d.getFullYear();
    return { display: `${mm}-${dd}-${yyyy}`, iso: `${yyyy}-${mm}-${dd}`, dateObj: new Date(yyyy, mm-1, dd) };
  }
  
  mm = pad2(Number(mm)); dd = pad2(Number(dd)); yyyy = String(yyyy);
  const result = { display: `${mm}-${dd}-${yyyy}`, iso: `${yyyy}-${mm}-${dd}`, dateObj: new Date(Number(yyyy), Number(mm)-1, Number(dd)) };
  console.log("Date normalization result:", result);
  return result;
}

// --- Parsing ---
function normalizeToken(tok) {
  return tok ? tok.replace(/\x00/g, "").replace(/\s+/g, "").trim() : "";
}
function parseBlocksFromCSV(text) {
  const lines = text.split(/\r?\n/);
  const blocks = [];
  let blockId = 0;
  for (let i = 0; i < lines.length; i++) {
    const normLine = lines[i].replace(/\x00/g, "").replace(/\s+/g, "");
    if (normLine.startsWith("File#")) {
      if (i + 1 < lines.length) {
        const header = lines[i].split(/,|\t/).map(normalizeToken);
        const row = lines[i + 1].split(/,|\t/).map(normalizeToken);
        while (row.length < header.length) row.push("");
        const rowObj = {};
        header.forEach((h, idx) => { rowObj[h] = row[idx] || ""; });
        rowObj["__BlockID"] = blockId;
        blocks.push(rowObj);
        blockId++;
      }
      i++;
    }
  }
  return blocks;
}
function reorderColumns(blocks) {
  if (!blocks.length) return { rows: [], headers: [] };
  const allHeaders = Object.keys(blocks[0]);
  const metaEnd = allHeaders.indexOf("MatchQual3");
  const metaCols = metaEnd >= 0 ? allHeaders.slice(0, metaEnd + 1) : [];
  const trailing = ["CalCheck","__BlockID"].filter(c => allHeaders.includes(c));
  const elementCandidates = allHeaders.filter(c => !metaCols.includes(c) && !trailing.includes(c) && c !== "IncludedInAverage");
  const pairs = [];
  const used = new Set();
  elementCandidates.forEach(col => {
    if (col.endsWith("Err")) {
      const base = col.slice(0,-3);
      if (elementCandidates.includes(base)) {
        pairs.push([base,col]);
        used.add(base); used.add(col);
      }
    }
  });
  const leftovers = elementCandidates.filter(c => !used.has(c));
  pairs.sort((a,b)=>a[0].localeCompare(b[0]));
  const elementSorted = pairs.flat().concat(leftovers.sort());
  elementCols = elementSorted;
  const newOrder = metaCols.concat(elementSorted, trailing);
  const reorderedRows = blocks.map(row => {
    const newRow = {};
    newOrder.forEach(h => newRow[h] = row[h] || "");
    return newRow;
  });
  return { rows: reorderedRows, headers: newOrder };
}

// --- File input ---
document.getElementById("csvFile").addEventListener("change", function() {
  const file = this.files[0];
  if (!file) return;
  document.getElementById("fileName").textContent = file.name;
  document.getElementById("fileName").style.display = "inline-block";
  const reader = new FileReader();
  reader.onload = function(e) {
    const text = e.target.result;
    const blocks = parseBlocksFromCSV(text);
    const {rows, headers} = reorderColumns(blocks);
    allSamples = rows;
    originalHeaders = headers;
    displayedRows = rows;
    populateDateDropdowns(rows);
    renderTable(displayedRows);
    document.getElementById("downloadBtn").disabled = false;
    updateGenerateButton();
  };
  reader.readAsText(file,"UTF-8");
});

// --- Date dropdowns ---
function populateDateDropdowns(rows) {
  const isoToDisplay = new Map();
  rows.forEach(row => {
    const dt = row["DateTime"] ? String(row["DateTime"]).trim() : "";
    if (!dt) return;
    const datePart = dt.split(" ")[0].trim();
    const norm = normalizeDatePart(datePart);
    if (norm && norm.iso) isoToDisplay.set(norm.iso, norm.display);
  });

  const sortedIso = Array.from(isoToDisplay.keys()).sort();

  const startSel = document.getElementById("startDateSelect");
  const endSel = document.getElementById("endDateSelect");
  startSel.innerHTML = '<option value="">-- All dates --</option>';
  endSel.innerHTML = '<option value="">-- All dates --</option>';

  sortedIso.forEach(iso => {
    const display = isoToDisplay.get(iso);
    const opt1 = document.createElement("option");
    opt1.value = iso; opt1.textContent = display; startSel.appendChild(opt1);
    const opt2 = document.createElement("option");
    opt2.value = iso; opt2.textContent = display; endSel.appendChild(opt2);
  });

  // Add event listeners for date filtering
  startSel.onchange = filterByDateRange;
  endSel.onchange = filterByDateRange;
}

function filterByDateRange() {
  const startIso = document.getElementById("startDateSelect").value;
  const endIso = document.getElementById("endDateSelect").value;
  
  // Clear existing chart when date range changes
  if (chart) {
    chart.destroy();
    chart = null;
  }
  document.getElementById('chartSection').style.display = 'none';
  
  if (!startIso && !endIso) {
    displayedRows = allSamples.slice();
    renderTable(displayedRows);
    return;
  }

  const startDate = startIso ? new Date(startIso + "T00:00:00") : null;
  const endDate = endIso ? new Date(endIso + "T23:59:59") : null;

  // Find the date column (same logic as in populateDateDropdowns)
  const dateColumns = ["DateTime", "Date", "Time", "Timestamp", "date", "datetime"];
  let dateColumn = null;
  
  if (allSamples.length > 0) {
    const availableColumns = Object.keys(allSamples[0]);
    dateColumn = dateColumns.find(col => availableColumns.includes(col));
    
    if (!dateColumn) {
      dateColumn = availableColumns.find(col => 
        col.toLowerCase().includes('date') || 
        col.toLowerCase().includes('time')
      );
    }
  }

  if (!dateColumn) {
    displayedRows = allSamples.slice();
    renderTable(displayedRows);
    return;
  }

  displayedRows = allSamples.filter(row => {
    const dt = row[dateColumn] ? String(row[dateColumn]).trim() : "";
    if (!dt) return false;
    const dateOnly = dt.split(" ")[0].trim();
    const norm = normalizeDatePart(dateOnly);
    if (!norm || !norm.iso) return false;
    const rowDate = new Date(norm.iso + "T12:00:00");
    if (startDate && rowDate < startDate) return false;
    if (endDate && rowDate > endDate) return false;
    return true;
  });

  renderTable(displayedRows);
  updateGenerateButton();
}

// --- Scaling checkbox ---
document.getElementById("scaleValues").addEventListener("change", function(){
  if (displayedRows.length>0) renderTable(displayedRows);
  // Regenerate chart if it exists
  if (chart && selectedElements.size > 0) {
    generateChart();
  }
});

// --- Render table ---
function renderTable(rows) {
  const output=document.getElementById("output");
  output.innerHTML="";
  if (!rows.length) { output.innerHTML="<p style='padding:20px;color:#64748b;'>No data matches filter.</p>"; return; }
  const headers=[...originalHeaders,"Units"];
  const table=document.createElement("table");
  const thead=document.createElement("thead");
  const tbody=document.createElement("tbody");
  const hr=document.createElement("tr");
  headers.forEach(h=>{const th=document.createElement("th"); th.textContent=h; hr.appendChild(th);});
  thead.appendChild(hr);
  const scale=document.getElementById("scaleValues").checked;
  const units=scale?"ppm":"raw";
  rows.forEach((row,idx)=>{
    const tr=document.createElement("tr");
    headers.forEach(h=>{
      let val=row[h]||"";
      if ((val==="<LOD"||val==="< LOD")) {} 
      else if (elementCols.includes(h)&&!isNaN(val)&&val!=="") {
        val=scale?Math.round(parseFloat(val)*10000):parseFloat(val);
      }
      if (h==="__BlockID") val=idx;
      if (h==="Units") val=units;
      const td=document.createElement("td");
      td.textContent=val;
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
  table.appendChild(thead); table.appendChild(tbody);
  const div=document.createElement("div"); div.className="table-container";
  div.appendChild(table);
  output.appendChild(div);
}

// --- Download ---
function downloadDisplayedRows() {
  if (!displayedRows.length) return;
  const scale=document.getElementById("scaleValues").checked;
  const units=scale?"ppm":"raw";
  const headers=[...originalHeaders,"Units"];
  let csv=headers.join(",")+"\n";
  displayedRows.forEach((row,idx)=>{
    const rowData=headers.map(h=>{
      let val=row[h]||"";
      if ((val==="<LOD"||val==="< LOD")) {}
      else if (elementCols.includes(h)&&!isNaN(val)&&val!=="") {
        val=scale?Math.round(parseFloat(val)*10000):parseFloat(val);
      }
      if (h==="__BlockID") val=idx;
      if (h==="Units") val=units;
      return val;
    });
    csv+=rowData.join(",")+"\n";
  });
  const blob=new Blob([csv],{type:"text/csv;charset=utf-8;"});
  const link=document.createElement("a");
  link.href=URL.createObjectURL(blob);
  link.download="Processed_XRF_Data.csv";
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
}

// --- Chart generation ---
function generateChart() {
  if (selectedElements.size === 0 || displayedRows.length === 0) {
    return;
  }
  
  const chartMode = document.querySelector('input[name="chartMode"]:checked').value;
  const scale = document.getElementById("scaleValues").checked;
  const selectedElementsArray = Array.from(selectedElements).sort();
  
  // Show chart section
  document.getElementById('chartSection').style.display = 'block';
  
  // Update date range info
  const dateRangeInfo = document.getElementById('dateRangeInfo');
  const dateRangeText = getDateRangeText();
  dateRangeInfo.innerHTML = `📅 ${dateRangeText} • ${displayedRows.length} samples analyzed`;
  dateRangeInfo.style.display = 'block';
  
  // Destroy existing chart if it exists
  if (chart) {
    chart.destroy();
    chart = null;
  }
  
  // Get canvas and reset its size
  const canvas = document.getElementById('averageChart');
  const ctx = canvas.getContext('2d');
  const units = scale ? "ppm" : "raw units";
  
  if (chartMode === 'averages') {
    generateAveragesChart(ctx, selectedElementsArray, scale, units);
  } else {
    generateIndividualChart(ctx, selectedElementsArray, scale, units);
  }
}

function generateAveragesChart(ctx, selectedElementsArray, scale, units) {
  // Calculate averages for selected elements
  const averages = {};
  const validCounts = {};
  
  selectedElementsArray.forEach(element => {
    averages[element] = 0;
    validCounts[element] = 0;
  });
  
  displayedRows.forEach(row => {
    selectedElementsArray.forEach(element => {
      let val = row[element] || "";
      
      // Skip <LOD values and empty values
      if (val === "<LOD" || val === "< LOD" || val === "" || isNaN(val)) return;
      
      const numVal = parseFloat(val);
      if (!isNaN(numVal)) {
        // Apply scaling if enabled (same logic as in renderTable)
        const scaledVal = scale ? numVal * 10000 : numVal;
        averages[element] += scaledVal;
        validCounts[element]++;
      }
    });
  });
  
  // Calculate final averages
  const chartData = {
    labels: [],
    values: []
  };
  
  selectedElementsArray.forEach(element => {
    if (validCounts[element] > 0) {
      const avg = averages[element] / validCounts[element];
      chartData.labels.push(element);
      chartData.values.push(Math.round(avg * 100) / 100); // Round to 2 decimal places
    }
  });
  
  // Create averages chart
  chart = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: chartData.labels,
      datasets: [{
        label: `Average Concentration (${units})`,
        data: chartData.values,
        backgroundColor: 'rgba(79, 70, 229, 0.6)',
        borderColor: 'rgba(79, 70, 229, 1)',
        borderWidth: 2,
        borderRadius: 8,
        borderSkipped: false
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        title: {
          display: true,
          text: `Average Element Concentrations`,
          font: { size: 16, weight: 'bold' },
          color: '#4f46e5'
        },
        legend: {
          display: true,
          position: 'top'
        }
      },
      scales: {
        y: {
          beginAtZero: true,
          title: {
            display: true,
            text: `Concentration (${units})`,
            font: { size: 14, weight: 'bold' }
          },
          grid: {
            color: 'rgba(0,0,0,0.1)'
          }
        },
        x: {
          title: {
            display: true,
            text: 'Elements',
            font: { size: 14, weight: 'bold' }
          },
          grid: {
            display: false
          }
        }
      },
      animation: {
        duration: 800,
        easing: 'easeOutQuart'
      }
    }
  });
}

function generateIndividualChart(ctx, selectedElementsArray, scale, units) {
  // For individual mode, we should only have one element
  if (selectedElementsArray.length !== 1) {
    console.error('Individual mode should only have one element selected');
    return;
  }
  
  const element = selectedElementsArray[0];
  const elementData = [];
  const sampleLabels = [];
  
  displayedRows.forEach((row, sampleIndex) => {
    // Use File# from the data as the label, fallback to sample index
    const fileNum = row['File#'] || `Sample ${sampleIndex + 1}`;
    sampleLabels.push(fileNum);
    
    let val = row[element] || "";
    
    // Handle <LOD values and empty values
    if (val === "<LOD" || val === "< LOD" || val === "" || isNaN(val)) {
      elementData.push(null); // null values won't be displayed
    } else {
      const numVal = parseFloat(val);
      if (!isNaN(numVal)) {
        const scaledVal = scale ? numVal * 10000 : numVal;
        elementData.push(Math.round(scaledVal * 100) / 100);
      } else {
        elementData.push(null);
      }
    }
  });
  
  // Create individual samples chart with single element
  chart = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: sampleLabels,
      datasets: [{
        label: `${element} (${units})`,
        data: elementData,
        backgroundColor: 'rgba(79, 70, 229, 0.6)',
        borderColor: 'rgba(79, 70, 229, 1)',
        borderWidth: 2,
        borderRadius: 8,
        borderSkipped: false
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        title: {
          display: true,
          text: `${element} Concentrations by Sample`,
          font: { size: 16, weight: 'bold' },
          color: '#4f46e5'
        },
        legend: {
          display: true,
          position: 'top'
        },
        tooltip: {
          callbacks: {
            title: function(context) {
              // Show the File# in the tooltip title
              return context[0].label;
            },
            label: function(context) {
              const value = context.parsed.y;
              return value !== null ? `${element}: ${value} ${units}` : `${element}: <LOD`;
            }
          }
        }
      },
      scales: {
        y: {
          beginAtZero: true,
          title: {
            display: true,
            text: `${element} Concentration (${units})`,
            font: { size: 14, weight: 'bold' }
          },
          grid: {
            color: 'rgba(0,0,0,0.1)'
          }
        },
        x: {
          title: {
            display: true,
            text: 'Sample Files',
            font: { size: 14, weight: 'bold' }
          },
          grid: {
            display: false
          }
        }
      },
      animation: {
        duration: 800,
        easing: 'easeOutQuart'
      },
      interaction: {
        mode: 'index',
        intersect: false
      }
    }
  });
}
</script>
